tags:
  - Auth
summary: Register a new user
operationId: registerUser
description: 'Register a new user with payload'
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - email
          - password
        properties:
          name:
            description: "User's full name"
            type: string
            example: 'John Doe'
          email:
            description: "User's email address"
            type: string
            format: email
            example: 'johndoe@example.com'
          password:
            description: "User's password"
            type: string
            format: password
            example: 'StrongPassw0rd!'
responses:
  '201':
    description: User successfully registered
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully registered a user!
            data:
              type: object
              $ref: ../../components/schemas/user.yaml
  '400':
    description: Invalid input data
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: Email already exists
  '404':
    $ref: '../../components/responses/404.yaml'
