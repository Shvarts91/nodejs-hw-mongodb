tags:
  - Auth
summary: Logout user
operationId: logoutUser
description: 'Logout the currently authenticated user and invalidate the refresh token'
security:
  - bearerAuth: []
responses:
  '200':
    description: Successfully logged out
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully logged out!
  '401':
    description: Unauthorized (no valid token provided)
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: Unauthorized
  '404':
    $ref: '../../components/responses/404.yaml'
